services:
  - type: web
    name: festivo-ai
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_FIRESTORE
        value: "false"
